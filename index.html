<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NexaMap — Карта мира</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #0b1020;
      color: #111827;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .topbar {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 14px;

      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 190px;
      padding: 10px 15px;

      border-radius: 14px;

      background: rgba(255,255,255,.94);
      box-shadow:
        0 10px 35px rgba(0,0,0,.18),
        0 2px 8px rgba(0,0,0,.08);

      pointer-events: auto;
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      color: white;
      font-weight: 900;
      font-size: 18px;

      background:
        linear-gradient(135deg, #2563eb, #06b6d4);

      box-shadow:
        0 5px 15px rgba(37,99,235,.35);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .brand-subtitle {
      color: #64748b;
      font-size: 11px;
      margin-top: 1px;
    }

    .search {
      position: relative;

      flex: 1;
      max-width: 620px;

      pointer-events: auto;
    }

    #searchInput {
      width: 100%;
      height: 52px;

      padding: 0 52px 0 48px;

      border: 0;
      outline: 0;
      border-radius: 16px;

      background: rgba(255,255,255,.96);

      color: #111827;
      font-size: 15px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.18),
        0 2px 8px rgba(0,0,0,.08);

      backdrop-filter: blur(12px);
    }

    #searchInput::placeholder {
      color: #94a3b8;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);

      color: #64748b;
      font-size: 19px;
    }

    #searchButton {
      position: absolute;
      right: 7px;
      top: 7px;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 11px;

      background: #2563eb;
      color: white;

      cursor: pointer;

      font-size: 17px;

      transition:
        transform .15s,
        background .15s;
    }

    #searchButton:hover {
      background: #1d4ed8;
      transform: scale(1.04);
    }

    .search-results {
      position: absolute;
      top: 59px;
      left: 0;
      right: 0;

      display: none;

      max-height: 360px;
      overflow: auto;

      padding: 6px;

      border-radius: 14px;

      background: rgba(255,255,255,.97);

      box-shadow: 0 15px 40px rgba(0,0,0,.2);

      backdrop-filter: blur(15px);
    }

    .search-results.visible {
      display: block;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 11px;

      width: 100%;

      padding: 11px 12px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      text-align: left;
      cursor: pointer;

      transition: background .12s;
    }

    .result:hover {
      background: #eff6ff;
    }

    .result-icon {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: #dbeafe;
      color: #2563eb;
    }

    .result-name {
      font-weight: 700;
      font-size: 14px;
    }

    .result-country {
      color: #64748b;
      font-size: 12px;
      margin-top: 2px;
    }

    .side-panel {
      position: fixed;
      z-index: 1000;

      top: 90px;
      left: 18px;

      width: 280px;

      border-radius: 16px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 12px 40px rgba(0,0,0,.18);

      backdrop-filter: blur(14px);

      overflow: hidden;
    }

    .panel-section {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .panel-title {
      margin-bottom: 10px;

      color: #334155;

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quick-button {
      min-height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border: 1px solid #e2e8f0;
      border-radius: 10px;

      background: #f8fafc;
      color: #334155;

      font-weight: 650;
      font-size: 12px;

      cursor: pointer;

      transition:
        background .15s,
        border-color .15s,
        transform .15s;
    }

    .quick-button:hover {
      background: #eff6ff;
      border-color: #bfdbfe;
      transform: translateY(-1px);
    }

    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 7px 0;

      color: #334155;
      font-size: 13px;
    }

    .switch {
      position: relative;

      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;

      cursor: pointer;

      border-radius: 20px;

      background: #cbd5e1;

      transition: .2s;
    }

    .slider::before {
      content: "";

      position: absolute;

      width: 16px;
      height: 16px;

      left: 3px;
      top: 3px;

      border-radius: 50%;

      background: white;

      box-shadow: 0 1px 4px rgba(0,0,0,.25);

      transition: .2s;
    }

    .switch input:checked + .slider {
      background: #2563eb;
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    .coordinates {
      position: fixed;
      left: 18px;
      bottom: 18px;

      z-index: 1000;

      padding: 9px 13px;

      border-radius: 10px;

      background: rgba(255,255,255,.94);

      box-shadow: 0 6px 25px rgba(0,0,0,.16);

      color: #475569;

      font-size: 12px;
      font-variant-numeric: tabular-nums;

      backdrop-filter: blur(10px);
    }

    .status {
      position: fixed;
      right: 18px;
      bottom: 18px;

      z-index: 1000;

      padding: 9px 13px;

      border-radius: 10px;

      background: rgba(255,255,255,.94);

      box-shadow: 0 6px 25px rgba(0,0,0,.16);

      color: #475569;

      font-size: 12px;

      backdrop-filter: blur(10px);
    }

    .status-dot {
      display: inline-block;

      width: 7px;
      height: 7px;

      margin-right: 6px;

      border-radius: 50%;

      background: #22c55e;
    }

    .location-button {
      position: fixed;

      right: 18px;
      bottom: 75px;

      z-index: 1000;

      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 14px;

      background: rgba(255,255,255,.96);

      color: #334155;

      box-shadow: 0 8px 28px rgba(0,0,0,.18);

      cursor: pointer;

      font-size: 20px;

      transition:
        transform .15s,
        background .15s;
    }

    .location-button:hover {
      transform: scale(1.05);
      background: white;
    }

    .leaflet-control-zoom {
      border: 0 !important;

      box-shadow:
        0 7px 25px rgba(0,0,0,.16) !important;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;

      line-height: 40px !important;

      border: 0 !important;

      color: #334155 !important;
    }

    .leaflet-control-attribution {
      background: rgba(255,255,255,.88) !important;
      backdrop-filter: blur(8px);
    }

    .custom-marker {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border: 3px solid white;
      border-radius: 50% 50% 50% 0;

      background: #2563eb;

      color: white;

      box-shadow:
        0 5px 15px rgba(0,0,0,.28);

      transform: rotate(-45deg);
    }

    .custom-marker span {
      transform: rotate(45deg);
    }

    .popup {
      min-width: 190px;
    }

    .popup h3 {
      margin: 0 0 5px;

      font-size: 16px;
      color: #111827;
    }

    .popup p {
      margin: 4px 0;

      color: #64748b;
      font-size: 12px;
    }

    .popup-button {
      width: 100%;

      margin-top: 9px;
      padding: 8px;

      border: 0;
      border-radius: 8px;

      background: #2563eb;
      color: white;

      cursor: pointer;

      font-weight: 700;
    }

    .route-info {
      display: none;

      position: fixed;

      top: 90px;
      right: 18px;

      z-index: 1000;

      width: 260px;

      padding: 15px;

      border-radius: 15px;

      background: rgba(255,255,255,.96);

      box-shadow: 0 12px 40px rgba(0,0,0,.18);

      backdrop-filter: blur(14px);
    }

    .route-info.visible {
      display: block;
    }

    .route-title {
      font-weight: 800;
      margin-bottom: 7px;
    }

    .route-text {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .close-route {
      float: right;

      border: 0;
      background: transparent;

      color: #94a3b8;

      cursor: pointer;
      font-size: 18px;
    }

    @media (max-width: 850px) {
      .topbar {
        left: 10px;
        right: 10px;
        top: 10px;
      }

      .brand {
        min-width: auto;
      }

      .brand-subtitle {
        display: none;
      }

      .side-panel {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 70px;

        width: auto;
        max-height: 190px;
        overflow-y: auto;
      }

      .panel-section {
        padding: 10px;
      }

      .coordinates {
        left: 10px;
        bottom: 10px;
      }

      .status {
        display: none;
      }

      .route-info {
        top: 72px;
        right: 10px;
        left: 10px;
        width: auto;
      }
    }

    @media (max-width: 600px) {
      .brand {
        padding: 8px 10px;
      }

      .logo {
        width: 32px;
        height: 32px;
      }

      .brand-title {
        font-size: 14px;
      }

      #searchInput {
        height: 46px;
        font-size: 13px;
      }

      .search-results {
        top: 52px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <header class="topbar">

    <div class="brand">
      <div class="logo">N</div>

      <div>
        <div class="brand-title">NexaMap</div>
        <div class="brand-subtitle">Интерактивная карта мира</div>
      </div>
    </div>

    <div class="search">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        autocomplete="off"
        placeholder="Поиск города или страны..."
        aria-label="Поиск"
      >

      <button id="searchButton" type="button">
        ↵
      </button>

      <div id="searchResults" class="search-results"></div>

    </div>

  </header>

  <aside class="side-panel">

    <section class="panel-section">

      <div class="panel-title">
        Быстрый переход
      </div>

      <div class="quick-buttons">

        <button
          class="quick-button"
          data-city="Москва"
        >
          🇷🇺 Москва
        </button>

        <button
          class="quick-button"
          data-city="Берлин"
        >
          🇩🇪 Берлин
        </button>

        <button
          class="quick-button"
          data-city="Лондон"
        >
          🇬🇧 Лондон
        </button>

        <button
          class="quick-button"
          data-city="Нью-Йорк"
        >
          🇺🇸 Нью-Йорк
        </button>

        <button
          class="quick-button"
          data-city="Токио"
        >
          🇯🇵 Токио
        </button>

        <button
          class="quick-button"
          data-city="Сидней"
        >
          🇦🇺 Сидней
        </button>

      </div>

    </section>

    <section class="panel-section">

      <div class="panel-title">
        Слои
      </div>

      <div class="layer-row">
        <span>Стандартная карта</span>

        <label class="switch">
          <input
            id="standardLayer"
            type="checkbox"
            checked
          >
          <span class="slider"></span>
        </label>
      </div>

      <div class="layer-row">
        <span>Спутник</span>

        <label class="switch">
          <input
            id="satelliteLayer"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>
      </div>

      <div class="layer-row">
        <span>Рельеф</span>

        <label class="switch">
          <input
            id="terrainLayer"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>
      </div>

    </section>

    <section class="panel-section">

      <div class="panel-title">
        Инструменты
      </div>

      <div class="quick-buttons">

        <button
          id="measureButton"
          class="quick-button"
        >
          📏 Измерить
        </button>

        <button
          id="clearButton"
          class="quick-button"
        >
          🧹 Очистить
        </button>

      </div>

    </section>

  </aside>

  <button
    id="locationButton"
    class="location-button"
    title="Моё местоположение"
    aria-label="Моё местоположение"
  >
    ◎
  </button>

  <div id="coordinates" class="coordinates">
    Координаты: —, —
  </div>

  <div class="status">
    <span class="status-dot"></span>
    NexaMap работает
  </div>

  <div id="routeInfo" class="route-info">

    <button
      id="closeRoute"
      class="close-route"
      aria-label="Закрыть"
    >
      ×
    </button>

    <div class="route-title">
      Измерение расстояния
    </div>

    <div id="routeText" class="route-text">
      Нажмите на карту, чтобы выбрать первую точку.
    </div>

  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

    const map = L.map("map", {
      center: [25, 10],
      zoom: 3,
      minZoom: 2,
      maxZoom: 19,
      zoomControl: true,
      worldCopyJump: true
    });

    const standardLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }
    );

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution:
          "Tiles &copy; Esri"
      }
    );

    const terrainLayer = L.tileLayer(
      "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 17,
        attribution:
          'Map data &copy; OpenStreetMap contributors, SRTM | Map style &copy; OpenTopoMap'
      }
    );

    standardLayer.addTo(map);

    const layers = {
      standard: standardLayer,
      satellite: satelliteLayer,
      terrain: terrainLayer
    };

    const markerLayer = L.layerGroup().addTo(map);

    const markerIcon = L.divIcon({
      className: "",
      html:
        '<div class="custom-marker"><span>●</span></div>',
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -34]
    });

    const cityMarkers = new Map();

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createCityPopup(city) {
      const safeName = escapeHTML(city.name);
      const safeCountry = escapeHTML(city.country);

      return `
        <div class="popup">
          <h3>${safeName}</h3>

          <p>🌍 ${safeCountry}</p>

          <p>
            📍 ${city.lat.toFixed(4)},
            ${city.lng.toFixed(4)}
          </p>

          <button
            class="popup-button"
            onclick="window.nexaFlyTo(${city.lat}, ${city.lng}, ${city.zoom})"
          >
            Открыть город
          </button>
        </div>
      `;
    }

    CITY_DATABASE.forEach(city => {
      const marker = L.marker(
        [city.lat, city.lng],
        {
          icon: markerIcon,
          title: city.name
        }
      );

      marker.bindPopup(createCityPopup(city));

      markerLayer.addLayer(marker);

      cityMarkers.set(city.name.toLowerCase(), marker);
    });

    window.nexaFlyTo = function(lat, lng, zoom) {
      map.flyTo(
        [lat, lng],
        zoom,
        {
          duration: 1.5
        }
      );
    };

    const searchInput =
      document.getElementById("searchInput");

    const searchButton =
      document.getElementById("searchButton");

    const searchResults =
      document.getElementById("searchResults");

    function normalizeText(text) {
      return text
        .toLowerCase()
        .trim()
        .replaceAll("ё", "е");
    }

    function searchCities(query) {
      const normalized =
        normalizeText(query);

      if (!normalized) {
        return [];
      }

      return CITY_DATABASE
        .filter(city => {
          const name =
            normalizeText(city.name);

          const country =
            normalizeText(city.country);

          return (
            name.includes(normalized) ||
            country.includes(normalized)
          );
        })
        .slice(0, 8);
    }

    function renderSearchResults(results) {
      searchResults.innerHTML = "";

      if (!results.length) {
        searchResults.innerHTML = `
          <div
            style="
              padding:15px;
              color:#64748b;
              font-size:13px;
            "
          >
            Ничего не найдено
          </div>
        `;

        searchResults.classList.add("visible");

        return;
      }

      results.forEach(city => {
        const button =
          document.createElement("button");

        button.className = "result";

        button.innerHTML = `
          <div class="result-icon">
            📍
          </div>

          <div>
            <div class="result-name">
              ${escapeHTML(city.name)}
            </div>

            <div class="result-country">
              ${escapeHTML(city.country)}
            </div>
          </div>
        `;

        button.addEventListener(
          "click",
          () => {
            searchInput.value =
              city.name;

            searchResults.classList.remove(
              "visible"
            );

            map.flyTo(
              [city.lat, city.lng],
              city.zoom,
              {
                duration: 1.5
              }
            );

            const marker =
              cityMarkers.get(
                city.name.toLowerCase()
              );

            if (marker) {
              setTimeout(() => {
                marker.openPopup();
              }, 700);
            }
          }
        );

        searchResults.appendChild(button);
      });

      searchResults.classList.add(
        "visible"
      );
    }

    function performSearch() {
      const query =
        searchInput.value;

      const results =
        searchCities(query);

      renderSearchResults(results);
    }

    searchInput.addEventListener(
      "input",
      () => {
        const query =
          searchInput.value.trim();

        if (!query) {
          searchResults.classList.remove(
            "visible"
          );

          return;
        }

        renderSearchResults(
          searchCities(query)
        );
      }
    );

    searchInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          performSearch();
        }

        if (event.key === "Escape") {
          searchResults.classList.remove(
            "visible"
          );

          searchInput.blur();
        }
      }
    );

    searchButton.addEventListener(
      "click",
      performSearch
    );

    document.addEventListener(
      "click",
      event => {
        if (
          !event.target.closest(".search")
        ) {
          searchResults.classList.remove(
            "visible"
          );
        }
      }
    );

    document
      .querySelectorAll(".quick-button[data-city]")
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const cityName =
              button.dataset.city;

            const city =
              CITY_DATABASE.find(
                item =>
                  item.name === cityName
              );

            if (!city) {
              return;
            }

            map.flyTo(
              [city.lat, city.lng],
              city.zoom,
              {
                duration: 1.5
              }
            );

            const marker =
              cityMarkers.get(
                city.name.toLowerCase()
              );

            if (marker) {
              setTimeout(
                () => marker.openPopup(),
                700
              );
            }
          }
        );
      });

    const standardCheckbox =
      document.getElementById(
        "standardLayer"
      );

    const satelliteCheckbox =
      document.getElementById(
        "satelliteLayer"
      );

    const terrainCheckbox =
      document.getElementById(
        "terrainLayer"
      );

    function updateBaseLayer() {
      if (
        standardCheckbox.checked
      ) {
        map.addLayer(
          layers.standard
        );
      } else {
        map.removeLayer(
          layers.standard
        );
      }

      if (
        satelliteCheckbox.checked
      ) {
        map.addLayer(
          layers.satellite
        );
      } else {
        map.removeLayer(
          layers.satellite
        );
      }

      if (
        terrainCheckbox.checked
      ) {
        map.addLayer(
          layers.terrain
        );
      } else {
        map.removeLayer(
          layers.terrain
        );
      }
    }

    standardCheckbox.addEventListener(
      "change",
      () => {
        if (
          !standardCheckbox.checked &&
          !satelliteCheckbox.checked &&
          !terrainCheckbox.checked
        ) {
          standardCheckbox.checked =
            true;
        }

        updateBaseLayer();
      }
    );

    satelliteCheckbox.addEventListener(
      "change",
      () => {
        if (
          !standardCheckbox.checked &&
          !satelliteCheckbox.checked &&
          !terrainCheckbox.checked
        ) {
          satelliteCheckbox.checked =
            true;
        }

        updateBaseLayer();
      }
    );

    terrainCheckbox.addEventListener(
      "change",
      () => {
        if (
          !standardCheckbox.checked &&
          !satelliteCheckbox.checked &&
          !terrainCheckbox.checked
        ) {
          terrainCheckbox.checked =
            true;
        }

        updateBaseLayer();
      }
    );

    const coordinates =
      document.getElementById(
        "coordinates"
      );

    map.on(
      "mousemove",
      event => {
        const lat =
          event.latlng.lat;

        const lng =
          event.latlng.lng;

        coordinates.textContent =
          `Координаты: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }
    );

    map.on(
      "mouseout",
      () => {
        coordinates.textContent =
          "Координаты: —, —";
      }
    );

    let measurementMode = false;
    let measurementPoints = [];
    let measurementLine = null;
    let measurementMarkers = [];

    const measureButton =
      document.getElementById(
        "measureButton"
      );

    const clearButton =
      document.getElementById(
        "clearButton"
      );

    const routeInfo =
      document.getElementById(
        "routeInfo"
      );

    const routeText =
      document.getElementById(
        "routeText"
      );

    const closeRoute =
      document.getElementById(
        "closeRoute"
      );

    function clearMeasurements() {
      measurementPoints = [];

      if (measurementLine) {
        map.removeLayer(
          measurementLine
        );

        measurementLine = null;
      }

      measurementMarkers.forEach(
        marker => {
          map.removeLayer(marker);
        }
      );

      measurementMarkers = [];
    }

    function haversineDistance(
      pointA,
      pointB
    ) {
      const earthRadius = 6371;

      const lat1 =
        pointA.lat *
        Math.PI /
        180;

      const lat2 =
        pointB.lat *
        Math.PI /
        180;

      const deltaLat =
        (pointB.lat - pointA.lat) *
        Math.PI /
        180;

      const deltaLng =
        (pointB.lng - pointA.lng) *
        Math.PI /
        180;

      const a =
        Math.sin(deltaLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(deltaLng / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return earthRadius * c;
    }

    function updateMeasurement() {
      if (
        measurementPoints.length < 2
      ) {
        routeText.textContent =
          "Выберите ещё одну точку на карте.";

        return;
      }

      let total = 0;

      for (
        let index = 1;
        index < measurementPoints.length;
        index++
      ) {
        total +=
          haversineDistance(
            measurementPoints[
              index - 1
            ],
            measurementPoints[index]
          );
      }

      routeText.innerHTML = `
        Точек: <strong>
          ${measurementPoints.length}
        </strong>
        <br>
        Расстояние:
        <strong>
          ${total.toLocaleString(
            "ru-RU",
            {
              maximumFractionDigits: 2
            }
          )} км
        </strong>
        <br><br>
        Нажимайте на карту дальше,
        чтобы продолжить измерение.
      `;
    }

    function addMeasurementPoint(
      latlng
    ) {
      measurementPoints.push(
        latlng
      );

      const marker =
        L.circleMarker(
          latlng,
          {
            radius: 6,
            color: "#ffffff",
            weight: 3,
            fillColor: "#2563eb",
            fillOpacity: 1
          }
        ).addTo(map);

      measurementMarkers.push(
        marker
      );

      if (
        measurementPoints.length > 1
      ) {
        if (measurementLine) {
          map.removeLayer(
            measurementLine
          );
        }

        measurementLine =
          L.polyline(
            measurementPoints,
            {
              color: "#2563eb",
              weight: 4,
              opacity: .85,
              dashArray: "8 8"
            }
          ).addTo(map);
      }

      updateMeasurement();
    }

    measureButton.addEventListener(
      "click",
      () => {
        measurementMode =
          !measurementMode;

        if (measurementMode) {
          measureButton.textContent =
            "⏹ Завершить";

          routeInfo.classList.add(
            "visible"
          );

          routeText.textContent =
            "Нажмите на карту, чтобы выбрать первую точку.";

          map.getContainer().style.cursor =
            "crosshair";
        } else {
          measureButton.textContent =
            "📏 Измерить";

          map.getContainer().style.cursor =
            "";

          updateMeasurement();
        }
      }
    );

    clearButton.addEventListener(
      "click",
      () => {
        clearMeasurements();

        routeInfo.classList.remove(
          "visible"
        );

        measurementMode =
          false;

        measureButton.textContent =
          "📏 Измерить";

        map.getContainer().style.cursor =
          "";
      }
    );

    closeRoute.addEventListener(
      "click",
      () => {
        routeInfo.classList.remove(
          "visible"
        );
      }
    );

    map.on(
      "click",
      event => {
        if (!measurementMode) {
          return;
        }

        addMeasurementPoint(
          event.latlng
        );
      }
    );

    const locationButton =
      document.getElementById(
        "locationButton"
      );

    let currentLocationMarker =
      null;

    locationButton.addEventListener(
      "click",
      () => {
        if (!navigator.geolocation) {
          alert(
            "Ваш браузер не поддерживает геолокацию."
          );

          return;
        }

        locationButton.textContent =
          "…";

        navigator.geolocation.getCurrentPosition(
          position => {
            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            if (
              currentLocationMarker
            ) {
              map.removeLayer(
                currentLocationMarker
              );
            }

            currentLocationMarker =
              L.circleMarker(
                [lat, lng],
                {
                  radius: 9,
                  color: "#ffffff",
                  weight: 4,
                  fillColor: "#2563eb",
                  fillOpacity: 1
                }
              ).addTo(map);

            currentLocationMarker.bindPopup(
              `
                <div class="popup">
                  <h3>Ваше положение</h3>
                  <p>
                    📍 ${lat.toFixed(5)},
                    ${lng.toFixed(5)}
                  </p>
                </div>
              `
            );

            map.flyTo(
              [lat, lng],
              15,
              {
                duration: 1.5
              }
            );

            currentLocationMarker.openPopup();

            locationButton.textContent =
              "◎";
          },
          error => {
            locationButton.textContent =
              "◎";

            const messages = {
              1:
                "Доступ к геолокации запрещён.",
              2:
                "Не удалось определить положение.",
              3:
                "Истекло время ожидания геолокации."
            };

            alert(
              messages[error.code] ||
              "Не удалось получить местоположение."
            );
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 30000
          }
        );
      }
    );

    /*
     * Keyboard shortcuts
     */

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.target.tagName ===
          "INPUT"
        ) {
          return;
        }

        if (event.key === "/") {
          event.preventDefault();

          searchInput.focus();

          return;
        }

        if (
          event.key === "Escape"
        ) {
          searchResults.classList.remove(
            "visible"
          );

          routeInfo.classList.remove(
            "visible"
          );
        }

        if (
          event.key === "m" ||
          event.key === "ь"
        ) {
          measureButton.click();
        }
      }
    );

    /*
     * Map initialization.
     */

    map.whenReady(
      () => {
        console.log(
          "NexaMap initialized."
        );

        console.log(
          `Loaded cities: ${CITY_DATABASE.length}`
        );
      }
    );

    /*
     * Keep map responsive after viewport changes.
     */

    let resizeTimer = null;

    window.addEventListener(
      "resize",
      () => {
        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          setTimeout(
            () => {
              map.invalidateSize();
            },
            150
          );
      }
    );

    /*
     * Prevent accidental browser
     * dragging of map UI elements.
     */

    document
      .querySelectorAll(
        ".topbar, .side-panel, .location-button, .coordinates, .status, .route-info"
      )
      .forEach(element => {
        L.DomEvent.disableClickPropagation(
          element
        );

        L.DomEvent.disableScrollPropagation(
          element
        );
      });
  </script>

</body>
</html>
